<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2fa36b">
  <title>ごはん日記</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>ごはん日記</h1>
  </header>

  <main>
    <!-- 食事記録 -->
    <section id="view-diary" class="view">
      <div class="date-nav">
        <button id="prev-day" aria-label="前の日">‹</button>
        <span id="date-label"></span>
        <button id="next-day" aria-label="次の日">›</button>
      </div>

      <div class="card score-card">
        <div class="score-ring" id="score-ring">
          <span id="score-value">--</span><small>点</small>
        </div>
        <div class="score-summary">
          <div class="kcal-line"><strong id="kcal-intake">0</strong> / <span id="kcal-target">0</span> kcal</div>
          <div class="kcal-remain" id="kcal-remain"></div>
          <div class="pfc" id="pfc"></div>
        </div>
      </div>

      <div id="meals"></div>

      <div class="card">
        <h2>栄養素バランス</h2>
        <div id="nutrients"></div>
      </div>

      <div class="card">
        <h2>今日のアドバイス</h2>
        <ul id="advice" class="advice"></ul>
      </div>
    </section>

    <!-- 体重 -->
    <section id="view-weight" class="view" hidden>
      <div class="card">
        <h2>体重を記録</h2>
        <form id="weight-form" class="row-form">
          <input type="date" id="weight-date" required>
          <input type="number" id="weight-value" step="0.1" min="20" max="300" placeholder="kg" required>
          <button type="submit" class="primary">記録</button>
        </form>
        <div id="weight-stats" class="stats"></div>
      </div>
      <div class="card">
        <h2>推移</h2>
        <div id="weight-chart" class="chart"></div>
      </div>
      <div class="card">
        <h2>履歴</h2>
        <ul id="weight-list" class="simple-list"></ul>
      </div>
    </section>

    <!-- 設定 -->
    <section id="view-settings" class="view" hidden>
      <div class="card">
        <h2>プロフィール</h2>
        <p class="hint" id="onboarding-hint" hidden>まずはプロフィールを登録して、あなたの目標カロリーを計算しましょう。</p>
        <form id="profile-form" class="grid-form">
          <label>性別
            <select name="sex"><option value="female">女性</option><option value="male">男性</option></select>
          </label>
          <label>年齢<input type="number" name="age" min="10" max="100" required></label>
          <label>身長 (cm)<input type="number" name="height" step="0.1" min="100" max="230" required></label>
          <label>現在の体重 (kg)<input type="number" name="weight" step="0.1" min="20" max="300" required></label>
          <label>目標体重 (kg)<input type="number" name="targetWeight" step="0.1" min="20" max="300" required></label>
          <label>活動量
            <select name="activity">
              <option value="low">低い（デスクワーク中心）</option>
              <option value="mid">ふつう（立ち仕事・軽い運動）</option>
              <option value="high">高い（肉体労働・運動習慣あり）</option>
            </select>
          </label>
          <label class="full">目標
            <select name="goal">
              <option value="lose_fast">しっかり減量（-500kcal/日）</option>
              <option value="lose">ゆっくり減量（-250kcal/日）</option>
              <option value="keep">体重を維持</option>
              <option value="gain">増量（+300kcal/日）</option>
            </select>
          </label>
          <button type="submit" class="primary full">保存</button>
        </form>
        <div id="target-info" class="stats"></div>
      </div>
      <div class="card">
        <h2>データ</h2>
        <div class="btn-row">
          <button id="export-btn">エクスポート</button>
          <label class="file-btn">インポート<input type="file" id="import-file" accept="application/json" hidden></label>
          <button id="reset-btn" class="danger">全データ削除</button>
        </div>
        <p class="hint">データはこの端末のブラウザ内にだけ保存されます。</p>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="diary" class="active">🍚<span>食事</span></button>
    <button data-view="weight">⚖️<span>体重</span></button>
    <button data-view="settings">⚙️<span>設定</span></button>
  </nav>

  <!-- 食品追加モーダル -->
  <dialog id="food-dialog">
    <div class="dialog-head">
      <h2 id="dialog-title">食品を追加</h2>
      <button class="close" data-close aria-label="閉じる">×</button>
    </div>
    <input type="search" id="food-search" placeholder="食品名で検索（例: ごはん、なっとう）">
    <div id="category-chips" class="chips"></div>
    <ul id="food-list" class="food-list"></ul>
    <details class="custom-food">
      <summary>見つからない場合: 食品を登録する</summary>
      <form id="custom-form" class="grid-form small">
        <label class="full">食品名<input name="name" required></label>
        <label>1食の目安<input name="unit" placeholder="1皿"></label>
        <label>エネルギー kcal<input type="number" step="any" min="0" name="kcal" required></label>
        <label>たんぱく質 g<input type="number" step="any" min="0" name="protein"></label>
        <label>脂質 g<input type="number" step="any" min="0" name="fat"></label>
        <label>炭水化物 g<input type="number" step="any" min="0" name="carbs"></label>
        <label>食物繊維 g<input type="number" step="any" min="0" name="fiber"></label>
        <label>食塩 g<input type="number" step="any" min="0" name="salt"></label>
        <label>カルシウム mg<input type="number" step="any" min="0" name="calcium"></label>
        <label>鉄 mg<input type="number" step="any" min="0" name="iron"></label>
        <label>ビタミンC mg<input type="number" step="any" min="0" name="vitc"></label>
        <button type="submit" class="primary full">登録して追加</button>
      </form>
    </details>
  </dialog>

  <!-- 量の選択 -->
  <dialog id="qty-dialog">
    <div class="dialog-head">
      <h2 id="qty-title"></h2>
      <button class="close" data-close aria-label="閉じる">×</button>
    </div>
    <p id="qty-unit" class="hint"></p>
    <div class="qty-control">
      <button type="button" id="qty-minus">−</button>
      <output id="qty-value">1</output>
      <button type="button" id="qty-plus">＋</button>
    </div>
    <p id="qty-kcal" class="qty-kcal"></p>
    <button id="qty-ok" class="primary wide">決定</button>
  </dialog>

  <script src="js/foods.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
